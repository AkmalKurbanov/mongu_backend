uuid: 0460df5e-659d-4f4c-be61-1024b8d40582
handle: Orders
type: stream
name: Заказы
drafts: false

primaryNavigation:
    label: Заказы
    icon: icon-shopping-cart
    order: 15

fields:
    # --- Вкладка 1: Основное и Статус ---
    status:
        label: Статус заказа
        type: dropdown
        default: new
        span: left
        tab: Основное
        options:
            new: 🆕 Новая заявка
            approved: 🟡 Согласовано / Ожидает оплаты
            paid: 🟢 Оплачено
            canceled: 🔴 Отменено

    total_price:
        label: Итоговая сумма ($ USD)
        type: number
        span: right
        tab: Основное
        comment: "Укажите итоговую сумму. Если 0 — выведется 'On request'"

    secure_token:
        label: Секретный токен (для чека)
        type: text
        span: full
        tab: Основное
        readOnly: true

    # --- Вкладка 2: Данные клиента ---
    client_name:
        label: Имя и Фамилия клиента
        type: text
        span: left
        tab: Клиент
    
    phone:
        label: Телефон / WhatsApp
        type: text
        span: right
        tab: Клиент

    email:
        label: Email
        type: text
        span: full
        tab: Клиент

    # --- Вкладка 3: Детали тура ---
    tour:
        label: Выбранный тур
        type: entries
        source: Tours
        maxItems: 1
        span: left
        tab: Детали поездки

    guests:
        label: Количество гостей (pax)
        type: number
        min: 1
        default: 1
        span: right
        tab: Детали поездки

    is_flexible_dates:
        label: Неточные / Гибкие даты
        type: switch
        span: right
        tab: Детали поездки

    date_start:
        label: Дата начала (Заезд)
        type: datepicker
        mode: date
        span: left
        tab: Детали поездки

    # --- Вкладка 4: Отель Mongu (доп. услуга к туру: до/после трека) ---
    hotel_stay_pax:
        label: "Mongu Hotel: Гостей"
        type: number
        min: 0
        default: 0
        span: full
        tab: Отель Mongu

    hotel_stay_start:
        label: Дата заезда (Mongu Hotel)
        type: datepicker
        mode: date
        span: left
        tab: Отель Mongu

    hotel_stay_end:
        label: Дата выезда (Mongu Hotel)
        type: datepicker
        mode: date
        span: right
        tab: Отель Mongu

    hotel_stay_notes:
        label: "Mongu Hotel: Пожелания клиента"
        type: textarea
        size: tiny
        span: full
        tab: Отель Mongu

    selected_addons:
        label: Выбранные доп. услуги
        type: repeater
        span: full
        tab: Доп. услуги и Заметки
        prompt: Добавить услугу
        form:
            fields:
                title:
                    label: Услуга из каталога
                    type: dropdown
                    options: App\Classes\BookingHelper::getAddonsDropdownOptions
                    span: left
                quantity:
                    label: Кол-во (шт/чел)
                    type: number
                    span: right
                    default: 0
                total_price:
                    label: Стоимость ($)
                    type: number
                    span: full
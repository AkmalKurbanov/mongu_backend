fields:

    preview:
        label: Превью карточки
        type: fileupload
        mode: image
        comment: 'Размер загружаемой картинки должен быть минимум 1200px. Перед загрузкой изображения ЖЕЛАТЕЛЬНО провести его предварительную оптимизацию с помощью сервиса <a href="https://squoosh.app/" target="_blank" rel="noopener">Squoosh</a>.'
        commentHtml: true
        span: left
        tab: Тизер карточка

    preview_position:
        label: Позиция кадрирования превью
        type: dropdown
        default: center-bg
        span: right
        tab: Тизер карточка
        options:
            center-bg: По центру (Центр)
            top-bg: Верх по центру
            bottom-bg: Низ по центру
            left-bg: Лево по центру
            right-bg: Право по центру
            top-left-bg: Верхний левый угол
            top-right-bg: Правый верхний угол
            bottom-left-bg: Нижний левый угол
            bottom-right-bg: Правый нижний угол      
    
    preview_caption:
        label: Подпись превью (SEO)
        comment: Опишите превью по теме
        type: text
        span: right
        tab: Тизер карточка


    # --- НАСТРОЙКИ СЕТКИ ---
    card_size:
        label: Размер карточки в сетке
        type: dropdown
        span: left
        default: normal
        tab: Тизер карточка
        options:
            normal: Стандартная (1x1)
            large: Большая (2x2)
            wide: Широкая (2x1)
            tall: Высокая (1x2)

    is_right:
        label: Сместить карточку вправо
        type: switch
        span: right
        default: false
        comment: Принудительный сдвиг карточки на правую колонку
        tab: Тизер карточка

    description:

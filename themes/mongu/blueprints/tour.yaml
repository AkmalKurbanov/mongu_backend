uuid: b6f022f4-5e98-4d30-9a43-97eda417d330
handle: Tours
type: stream
name: Туры
drafts: true

primaryNavigation:
    label: Каталог туров
    icon: icon-compass
    order: 22

navigation:
    label: Все туры
    icon: icon-flag
    order: 10

fields:
    # --- СТАТУС ---
    is_active:
        label: Опубликован
        type: switch
        default: true
        span: left
        tab: Статус

    is_featured:
        label: Популярный тур (выводить на главной)
        type: switch
        default: false
        span: right
        tab: Статус

    # --- ТИЗЕР КАРТОЧКА ---
    preview:
        label: Превью карточки
        type: fileupload
        mode: image
        imageWidth: 800
        span: left
        tab: Тизер карточка

    preview_position:
        label: Позиция кадрирования превью
        type: dropdown
        default: center-bg
        span: right
        tab: Тизер карточка
        options: &bg_positions
            center-bg: По центру (Центр)
            top-bg: Верх по центру
            bottom-bg: Низ по центру
            left-bg: Лево по центру
            right-bg: Право по центру
            top-left-bg: Верхний левый угол
            top-right-bg: Правый верхний угол
            bottom-left-bg: Нижний левый угол
            bottom-right-bg: Правый нижний угол

    preview_caption:
        label: Подпись превью (SEO alt)
        type: text
        span: right
        tab: Тизер карточка

    # --- СВЯЗИ И ПАРАМЕТРЫ ---
    category:
        label: Категория
        type: entries
        source: Categories
        maxItems: 1
        span: left
        tab: Параметры

    destination:
        label: Дестинация
        type: entries
        source: Destinations
        maxItems: 1
        span: right
        tab: Параметры

    description:
        label: Краткое описание (для карточки)
        type: textarea
        size: tiny
        span: full
        tab: Параметры

    program_price:
        label: "Цена (например: $1200)"
        type: text
        span: left
        tab: Параметры

    tour_duration:
        label: "Продолжительность (например: 7 days / 6 nights)"
        type: text
        span: right
        tab: Параметры

    season:
        label: "Сезон (например: June – September)"
        type: text
        span: left
        tab: Параметры

    height:
        label: "Максимальная высота (например: 3800m)"
        type: text
        span: right
        tab: Параметры

    technical_difficulty_lvl:
        label: Техническая сложность
        type: dropdown
        span: left
        tab: Параметры
        options:
            Basic: Базовый
            Intermediate: Средний
            Advanced: Продвинутый
            Expert: Экспертный

    physical_difficulty_lvl:
        label: Физическая сложность
        type: dropdown
        span: right
        tab: Параметры
        options:
            Basic: Базовый
            Intermediate: Средний
            Advanced: Продвинутый
            Expert: Экспертный

    # --- ГАЛЕРЕЯ ---
    gallery_items:
        label: Галерея тура
        type: repeater
        maxItems: 5
        span: full
        prompt: Добавить фото
        tab: Галерея
        form:
            fields:
                image:
                    label: Фотография
                    type: fileupload
                    mode: image
                    imageWidth: 1920
                    span: left
                caption:
                    label: Подпись к фото (SEO alt)
                    type: text
                    span: right

    # --- ПРОГРАММА И ОПИСАНИЕ ---
    content:
        label: Полное описание тура
        type: richeditor
        span: full
        tab: Программа

    itinerary_days:
        label: Маршрут по дням
        type: repeater
        span: full
        prompt: Добавить день
        tab: Программа
        form:
            fields:
                day_title:
                    label: "День и маршрут (напр: Day 1. Bishkek – Karakol)"
                    type: text
                    span: full
                day_content:
                    label: Детали дня
                    type: richeditor
                    size: tiny
                    span: full

    prices_content:
        label: Что включено / Не включено в стоимость
        type: richeditor
        span: full
        tab: Условия и цены

    # --- ДАТЫ ВЫЕЗДОВ ---
    tour_dates:
        label: График заездов
        type: repeater
        span: full
        prompt: Добавить дату
        tab: Даты
        form:
            fields:
                date_start:
                    label: Дата начала
                    type: datepicker
                    mode: date
                    format: "F j, Y"
                    span: left
                date_end:
                    label: Дата окончания
                    type: datepicker
                    mode: date
                    format: "F j, Y"
                    span: right
                price:
                    label: Цена на эту дату
                    type: text
                    span: full

    additional_accordions:
        label: Аккордеоны с дополнительной информацией
        type: repeater
        span: full
        prompt: Добавить блок информации
        tab: Доп. информация
        form:
            fields:
                acc_title:
                    label: Заголовок аккордеона
                    type: text
                    span: left
                acc_content:
                    label: Содержимое блока
                    type: richeditor
                    size: tiny
                    span: right

    # --- КАРТА ---
    map_type:
        label: Тип карты
        type: dropdown
        default: image
        span: left
        tab: Карта
        options:
            none: Без карты
            image: Изображение
            iframe: Интерактивная карта (Google Maps embed)

    tour_map_image:
        label: Файл карты (изображение)
        type: fileupload
        mode: image
        imageWidth: 1920
        span: right
        tab: Карта
        trigger:
            action: show
            field: map_type
            condition: value[image]

    tour_map_frame:
        label: Интерактивный код (Google My Maps iframe src)
        type: textarea
        size: tiny
        span: right
        tab: Карта
        trigger:
            action: show
            field: map_type
            condition: value[iframe]

    # --- SEO ---
    meta_title:
        label: Meta Title (Google / Yandex)
        type: text
        span: left
        tab: SEO (Поиск)

    meta_description:
        label: Meta Description (Google / Yandex)
        type: textarea
        size: tiny
        span: right
        tab: SEO (Поиск)

    # --- Соцсети (Open Graph) ---
    og_title:
        label: OG Title (Telegram / WhatsApp)
        type: text
        span: left
        tab: Соцсети (OG)

    og_description:
        label: OG Description (Telegram / WhatsApp)
        type: textarea
        size: tiny
        span: right
        tab: Соцсети (OG)

    og_image:
        label: Open Graph Image (1200x630)
        type: fileupload
        mode: image
        imageWidth: 1200
        imageHeight: 630
        span: full
        tab: Соцсети (OG)
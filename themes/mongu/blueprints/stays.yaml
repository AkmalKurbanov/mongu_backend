uuid: 57f2da1b-73f1-4af9-81c6-e22438e9610b
handle: StayBookings
type: stream
name: Бронирование проживания
drafts: false

primaryNavigation:
    label: Проживание
    icon: icon-bed
    order: 16

fields:
    # --- Вкладка 1: Основное, статус, цена и оплата ---
    status:
        label: Статус заказа
        type: dropdown
        default: new
        span: left
        tab: Основное
        options:
            new: 🆕 Новая заявка
            approved: 🟡 Согласовано / Ожидает оплаты
            payment_pending: ⏳ Платёж обрабатывается
            paid: 🟢 Оплачено
            canceled: 🔴 Отменено

    total_price:
        label: Итоговая сумма ($ USD)
        type: number
        span: right
        tab: Основное
        comment: "Считается автоматически, если у объекта указана цена. 0 — клиенту выведется 'On request'. После согласования с менеджером впишите итог сюда."

    lodging_snapshot_price:
        label: "Снимок: Цена за ночь ($)"
        type: number
        span: left
        tab: Основное
        readOnly: true
        comment: "Зафиксированная стоимость объекта на момент брони"  

    manager_notes:
        label: Заметки менеджера (клиент не видит)
        type: textarea
        size: small
        span: full
        tab: Основное

    secure_token:
        label: Секретный токен (для чека)
        type: text
        span: left
        tab: Основное
        readOnly: true

    # --- Вкладка 2: Данные клиента ---
    client_name:
        label: Имя и Фамилия клиента
        type: text
        span: left
        tab: Клиент

    phone:
        label: Телефон / WhatsApp
        type: text
        span: right
        tab: Клиент

    email:
        label: Email
        type: text
        span: full
        tab: Клиент

    # --- Вкладка 3: Проживание ---
    lodging:
        label: Объект размещения
        type: dropdown
        span: left
        tab: Проживание
        options: App\Classes\StayHelper::getLodgingOptions

    guests:
        label: Количество гостей
        type: number
        min: 1
        default: 1
        span: right
        tab: Проживание

    check_in:
        label: Дата заезда
        type: datepicker
        mode: date
        span: left
        tab: Проживание

    check_out:
        label: Дата выезда
        type: datepicker
        mode: date
        span: right
        tab: Проживание

    nights:
        label: Ночей
        type: number
        span: left
        tab: Проживание

    is_flexible_dates:
        label: Неточные / Гибкие даты
        type: switch
        span: right
        tab: Проживание

    notes:
        label: Пожелания клиента
        type: textarea
        size: small
        span: full
        tab: Проживание

    # --- Банковский эквайринг ---
    currency:
        label: Валюта
        type: dropdown
        default: USD
        span: right
        tab: Основное
        options:
            USD: USD ($)
            KGS: KGS (сом)
            EUR: EUR (€)

    payment_url:
        label: Ссылка на оплату банка
        type: text
        span: full
        tab: Основное
        comment: "Генерируется автоматически или вставляется вручную"

    transaction_id:
        label: ID транзакции / инвойса в банке
        type: text
        span: left
        tab: Основное
        readOnly: true

    payment_method:
        label: Провайдер оплаты
        type: text
        span: right
        tab: Основное
        readOnly: true
        comment: "Например: FreedomPay, DemirBank, Stripe, Manual Link"
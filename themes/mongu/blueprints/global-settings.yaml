uuid: cd1f33f1-c61b-430e-9a8a-01acff956edd
handle: GlobalSettings
type: global
name: Настройки основной информации

primaryNavigation:
    label: Settings
    icon: icon-magic
    order: 20

fields:
    # --- ТАБ: Основное ---
    website_name:
        label: Название компании
        type: text
        span: full
        tab: Основное

    email_address:
        label: Email адрес
        type: text
        placeholder: "mongu.karakol@gmail.com"
        span: left
        tab: Основное

    address:
        label: Адрес
        type: text
        placeholder: "Kyrgyzstan, Karakol city, Jusaev st., 83"
        span: right
        tab: Основное

    # --- ТАБ: Контакты и соцсети ---
    whatsapp_number:
        label: Номер телефона (WhatsApp)
        type: text
        placeholder: "+996 123 456 789"
        span: full
        tab: Контакты

    instagram_nickname:
        label: Instagram nickname
        type: text
        placeholder: "@monguhotel"
        span: left
        tab: Контакты

    instagram_url:
        label: Instagram URL
        type: text
        placeholder: "https://instagram.com/..."
        span: right
        tab: Контакты

    # --- ТАБ: Интеграции и Карта ---
    map_url:
        label: Ссылка на карту (iframe src / embed)
        type: textarea
        size: tiny
        span: full
        tab: Интеграции

    analytics_code:
        label: Код счетчиков аналитики (Google Tag Manager / Analytics)
        comment: Вставляется перед закрывающим тегом </head>
        type: textarea
        size: small
        span: full
        tab: Интеграции
    
    # --- ТАБ: Дополнительные услуги (Addons) ---
    hotel_price_per_night:
        label: "Стоимость проживания в отельном номере Mongu ($/чел/ночь)"
        comment: "Указывается цена за 1 человека за 1 ночь (по умолчанию 50)"
        type: text
        default: "50"
        span: left
        tab: Доп. услуги

    addons:
        label: Дополнительные услуги (Отображаются в форме бронирования)
        type: repeater
        tab: Доп. услуги
        prompt: Добавить услугу
        form:
            fields:
                is_highlighted:
                    label: Выделить как рекомендацию
                    type: switch
                    span: full

                highlight_header:
                    label: Заголовок шапки (напр. STAY WITH US IN KARAKOL)
                    type: text
                    span: left
                    trigger:
                        action: show
                        field: is_highlighted
                        condition: checked

                badge_text:
                    label: Текст бейджа (напр. OUR PROPERTY)
                    type: text
                    span: right
                    trigger:
                        action: show
                        field: is_highlighted
                        condition: checked
                code:
                    label: "Системный код (напр. mongu_rooms, single_tents, transfer)"
                    comment: "Важно для программистов (без пробелов, латиницей)"
                    type: text
                    span: left
                    required: true
                title:
                    label: Название услуги
                    type: text
                    span: right
                    required: true
                description:
                    label: Краткое описание
                    type: text
                    span: full
                price:
                    label: Цена в долларах (только цифра, напр. 80)
                    type: text
                    span: left
                    required: true
                input_type:
                    label: Тип поля
                    type: dropdown
                    span: right
                    options:
                        counter: Счетчик (выбор количества)
                        checkbox: Чекбокс (да/нет)
                icon:
                    label: Иконка (ID из спрайта, напр. hotel)
                    comment: "Используется, если включено выделение как рекомендации"
                    type: text
                    span: left
                exclude_categories:
                    label: "Скрыть для категорий туров:"
                    comment: "Выберите динамические категории туров"
                    type: entries
                    source: Categories
                    span: left

                exclude_fixed:
                    label: "Скрыть для проживания:"
                    comment: "Отметьте объекты размещения"
                    type: checkboxlist
                    options:
                        sokmo: "Sokmo Lodge"
                        mongu: "Mongu Hotel"
                    span: right